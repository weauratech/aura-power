name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_SERVER: ghcr.io/weauratech/aura-power-server
  IMAGE_CONTROLLER: ghcr.io/weauratech/aura-power-controller

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build and push server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_SERVER }}:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE_SERVER }}:latest
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}

      - name: Build and push controller
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.controller
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_CONTROLLER }}:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE_CONTROLLER }}:latest
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign images
        run: |
          cosign sign --yes ${{ env.IMAGE_SERVER }}:${{ steps.version.outputs.tag }}
          cosign sign --yes ${{ env.IMAGE_CONTROLLER }}:${{ steps.version.outputs.tag }}

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_SERVER }}:${{ steps.version.outputs.tag }}
          artifact-name: sbom-server.spdx.json

      - name: Generate SBOM (controller)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_CONTROLLER }}:${{ steps.version.outputs.tag }}
          artifact-name: sbom-controller.spdx.json

  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  helm:
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Extract version
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Package and push Helm chart
        run: |
          helm package charts/aura-power --version ${{ steps.version.outputs.tag }} --app-version ${{ steps.version.outputs.tag }}
          helm push aura-power-${{ steps.version.outputs.tag }}.tgz oci://ghcr.io/weauratech/charts
