name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_SERVER: ghcr.io/weauratech/aura-power-server
  IMAGE_CONTROLLER: ghcr.io/weauratech/aura-power-controller

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install envtest assets
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@v0.0.0-20250308055145-5fe7bb3edc86
          setup_envtest="$(go env GOPATH)/bin/setup-envtest"
          echo "KUBEBUILDER_ASSETS=$("$setup_envtest" use -p path 1.31.x!)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
      - name: Test release candidate
        run: make quality quality-acceptance quality-envtest quality-load

  kind-acceptance:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/e2e/playwright/package-lock.json
      - uses: helm/kind-action@0b5c88445f37b7e12a2ce1ecca7805b9046a74db # v1
        with:
          cluster_name: aura-power-quality
          node_image: kindest/node:v1.35.0
          version: v0.32.0
      - uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
      - name: Build and load candidate images
        run: |
          docker build -f Dockerfile.server -t aura-power-server:release-candidate .
          docker build -f Dockerfile.controller -t aura-power-controller:release-candidate .
          kind load docker-image --name aura-power-quality aura-power-server:release-candidate aura-power-controller:release-candidate
          CGO_ENABLED=0 go build -ldflags="-s -w" -o bin/aura-power ./cmd/aura-power/
      - name: Prove v2.1.7 full release upgrade
        env:
          CANDIDATE_SERVER_IMAGE: aura-power-server:release-candidate
          CANDIDATE_CONTROLLER_IMAGE: aura-power-controller:release-candidate
        run: ./scripts/quality/kind-release-upgrade-journey.sh
      - name: Install candidate and run native journey
        run: |
          export KUBECONFIG="${KUBECONFIG:-$HOME/.kube/config}"
          helm upgrade --install aura-power charts/aura-power \
            --namespace aura-system --create-namespace --wait --timeout 5m \
            --set server.image.repository=aura-power-server \
            --set server.image.tag=release-candidate \
            --set server.image.pullPolicy=Never \
            --set server.persistence.enabled=false \
            --set controller.image.repository=aura-power-controller \
            --set controller.image.tag=release-candidate \
            --set controller.image.pullPolicy=Never
          ./scripts/quality/kind-helm-upgrade-admission.sh
          ./scripts/quality/kind-legacy-upgrade-journey.sh
          ./scripts/quality/kind-core-journey.sh
          ./scripts/quality/kind-approval-journey.sh
          ./scripts/quality/kind-notification-journey.sh
          ./scripts/quality/kind-argocd-journey.sh
          ./scripts/quality/kind-cli-journey.sh
      - name: Run controller cardinality, memory and leader failover soak
        run: |
          export KUBECONFIG="${KUBECONFIG:-$HOME/.kube/config}"
          ./scripts/quality/kind-memory-soak.sh
      - name: Upload controller memory diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: controller-memory-release
          path: artifacts/quality/memory-*
      - name: Install browser test dependencies
        run: |
          cd tests/e2e/playwright
          npm ci
          npx playwright install --with-deps chromium firefox webkit
      - name: Run real multi-browser journey
        run: |
          kubectl create namespace aura-power-e2e-browser
          kubectl annotate namespace aura-power-e2e-browser aura.sh/power-eligible=true
          kubectl create deployment browser-fixture -n aura-power-e2e-browser --image=registry.k8s.io/pause:3.10 --replicas=1
          kubectl create namespace aura-power-e2e-browser-homonym
          kubectl annotate namespace aura-power-e2e-browser-homonym aura.sh/power-eligible=true
          kubectl create deployment browser-fixture -n aura-power-e2e-browser-homonym --image=registry.k8s.io/pause:3.10 --replicas=1
          for _ in $(seq 1 40); do
            if kubectl get powertarget -n aura-system -l power.aura.sh/target-namespace=aura-power-e2e-browser -o name | grep -q .; then break; fi
            sleep 5
          done
          kubectl get powertarget -n aura-system -l power.aura.sh/target-namespace=aura-power-e2e-browser -o name | grep -q .
          kubectl port-forward -n aura-system statefulset/aura-power-server 19091:8080 >/tmp/aura-power-port-forward.log 2>&1 &
          forward_pid=$!
          trap 'kill "$forward_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:19091/api/v1/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:19091/api/v1/health >/dev/null
          admin_password="$(kubectl get secret aura-power-server-secret -n aura-system -o jsonpath='{.data.admin-password}' | base64 -d)"
          cd tests/e2e/playwright
          CI=true AURA_E2E_BASE_URL=http://127.0.0.1:19091 AURA_E2E_ADMIN_USER=admin \
            AURA_E2E_ADMIN_PASSWORD="$admin_password" AURA_E2E_FIXTURE_NAMESPACE=aura-power-e2e-browser \
            AURA_E2E_KUBECONFIG="${KUBECONFIG:-$HOME/.kube/config}" \
            AURA_E2E_ALLOW_MUTATION=true AURA_E2E_BROWSERS=all npx playwright test
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-release
          path: |
            tests/e2e/playwright/playwright-report
            tests/e2e/playwright/test-results

  docker-amd64:
    runs-on: ubuntu-latest
    needs: kind-acceptance
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract version
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
      - name: Build server (amd64)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.server
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_SERVER }}:${{ steps.version.outputs.tag }}-amd64
          cache-from: type=gha,scope=server-amd64
          cache-to: type=gha,mode=max,scope=server-amd64
      - name: Build controller (amd64)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.controller
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_CONTROLLER }}:${{ steps.version.outputs.tag }}-amd64
          cache-from: type=gha,scope=controller-amd64
          cache-to: type=gha,mode=max,scope=controller-amd64

  docker-arm64:
    runs-on: ubuntu-24.04-arm
    needs: kind-acceptance
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract version
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
      - name: Build server (arm64)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.server
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE_SERVER }}:${{ steps.version.outputs.tag }}-arm64
          cache-from: type=gha,scope=server-arm64
          cache-to: type=gha,mode=max,scope=server-arm64
      - name: Build controller (arm64)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.controller
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE_CONTROLLER }}:${{ steps.version.outputs.tag }}-arm64
          cache-from: type=gha,scope=controller-arm64
          cache-to: type=gha,mode=max,scope=controller-arm64

  docker-manifest:
    runs-on: ubuntu-latest
    needs: [docker-amd64, docker-arm64]
    permissions:
      packages: write
    steps:
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract version
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
      - name: Create multi-arch manifests
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${TAG#v}"
          # Server
          docker buildx imagetools create -t "${{ env.IMAGE_SERVER }}:${TAG}" -t "${{ env.IMAGE_SERVER }}:${VERSION}" \
            "${{ env.IMAGE_SERVER }}:${TAG}-amd64" \
            "${{ env.IMAGE_SERVER }}:${TAG}-arm64"
          # Controller
          docker buildx imagetools create -t "${{ env.IMAGE_CONTROLLER }}:${TAG}" -t "${{ env.IMAGE_CONTROLLER }}:${VERSION}" \
            "${{ env.IMAGE_CONTROLLER }}:${TAG}-amd64" \
            "${{ env.IMAGE_CONTROLLER }}:${TAG}-arm64"

  sign:
    runs-on: ubuntu-latest
    needs: docker-manifest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3
      - name: Extract version
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
      - name: Sign images
        run: |
          SERVER_DIGEST="$(docker buildx imagetools inspect "${{ env.IMAGE_SERVER }}:${{ steps.version.outputs.tag }}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          CONTROLLER_DIGEST="$(docker buildx imagetools inspect "${{ env.IMAGE_CONTROLLER }}:${{ steps.version.outputs.tag }}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          cosign sign --yes "${{ env.IMAGE_SERVER }}@${SERVER_DIGEST}"
          cosign sign --yes "${{ env.IMAGE_CONTROLLER }}@${CONTROLLER_DIGEST}"

  goreleaser:
    runs-on: ubuntu-latest
    needs: sign
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  helm:
    runs-on: ubuntu-latest
    needs: [sign, goreleaser]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Extract version
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
      - name: Package and push Helm chart
        run: |
          helm package charts/aura-power --version ${{ steps.version.outputs.tag }} --app-version ${{ steps.version.outputs.tag }}
          helm push aura-power-${{ steps.version.outputs.tag }}.tgz oci://ghcr.io/weauratech/charts

  promote-latest:
    runs-on: ubuntu-latest
    needs: helm
    permissions:
      packages: write
    steps:
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote verified images
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          docker buildx imagetools create -t "${{ env.IMAGE_SERVER }}:latest" "${{ env.IMAGE_SERVER }}:${TAG}"
          docker buildx imagetools create -t "${{ env.IMAGE_CONTROLLER }}:latest" "${{ env.IMAGE_CONTROLLER }}:${TAG}"
