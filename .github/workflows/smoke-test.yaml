name: Smoke Tests

# No target or credential defaults. This remote smoke is read-only; mutating
# acceptance runs only in disposable Kind or through the watchdog EKS runner.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Target URL for smoke tests'
        required: true
      username:
        description: 'Admin username'
        required: true
      fixture_namespace:
        description: 'Dedicated fixture namespace admitted for this run'
        required: true

permissions:
  contents: read

jobs:
  frontend-smoke:
    name: Frontend Smoke Tests (Playwright)
    runs-on: ubuntu-latest
    environment: aura-power-smoke
    env:
      INPUT_BASE_URL: ${{ inputs.base_url }}
      INPUT_USERNAME: ${{ inputs.username }}
      ALLOWED_BASE_URL: ${{ secrets.AURA_POWER_SMOKE_ALLOWED_ORIGIN }}
      INPUT_FIXTURE_NAMESPACE: ${{ inputs.fixture_namespace }}
      ALLOWED_FIXTURE_NAMESPACE: ${{ secrets.AURA_POWER_SMOKE_ALLOWED_NAMESPACE }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Validate protected target
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$ALLOWED_BASE_URL" ]]
          [[ -n "$ALLOWED_FIXTURE_NAMESPACE" ]]
          [[ "$INPUT_BASE_URL" == "$ALLOWED_BASE_URL" ]]
          [[ "$INPUT_BASE_URL" == https://* ]]
          [[ "$INPUT_FIXTURE_NAMESPACE" == "$ALLOWED_FIXTURE_NAMESPACE" ]]
          [[ "$INPUT_FIXTURE_NAMESPACE" =~ ^aura-power-e2e-[a-z0-9-]+$ ]]
      - name: Install dependencies
        run: cd tests/e2e/playwright && npm ci
      - name: Install Playwright browsers
        run: cd tests/e2e/playwright && npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: cd tests/e2e/playwright && npx playwright test
        env:
          AURA_E2E_BASE_URL: ${{ env.INPUT_BASE_URL }}
          AURA_E2E_ADMIN_USER: ${{ env.INPUT_USERNAME }}
          AURA_E2E_ADMIN_PASSWORD: ${{ secrets.AURA_POWER_SMOKE_PASSWORD }}
          AURA_E2E_FIXTURE_NAMESPACE: ${{ env.INPUT_FIXTURE_NAMESPACE }}
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: tests/e2e/playwright/playwright-report/
          retention-days: 7
