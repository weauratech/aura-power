apiVersion: apps/v1
kind: Deployment
metadata:
  name: contended-deployment
  namespace: __NAMESPACE__
  annotations:
    aura.sh/power-eligible: "true"
spec:
  replicas: 2
  selector:
    matchLabels: {app: contended-deployment}
  template:
    metadata:
      labels: {app: contended-deployment}
    spec:
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
