apiVersion: apps/v1
kind: Deployment
metadata:
  name: appset-deployment
  namespace: __NAMESPACE__
  annotations:
    aura.sh/power-eligible: "true"
  labels:
    aura-power-quality/revision: v1
spec:
  replicas: 1
  selector:
    matchLabels: {app: appset-deployment}
  template:
    metadata:
      labels: {app: appset-deployment}
    spec:
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
---
apiVersion: v1
kind: Service
metadata:
  name: appset-statefulset
  namespace: __NAMESPACE__
  labels:
    aura-power-quality/revision: v1
spec:
  clusterIP: None
  selector: {app: appset-statefulset}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: appset-statefulset
  namespace: __NAMESPACE__
  annotations:
    aura.sh/power-eligible: "true"
  labels:
    aura-power-quality/revision: v1
spec:
  serviceName: appset-statefulset
  replicas: 1
  selector:
    matchLabels: {app: appset-statefulset}
  template:
    metadata:
      labels: {app: appset-statefulset}
    spec:
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: appset-cronjob
  namespace: __NAMESPACE__
  annotations:
    aura.sh/power-eligible: "true"
  labels:
    aura-power-quality/revision: v1
spec:
  schedule: "0 0 31 2 *"
  suspend: false
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: pause
              image: registry.k8s.io/pause:3.10
