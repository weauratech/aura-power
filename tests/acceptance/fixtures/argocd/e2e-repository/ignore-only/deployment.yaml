apiVersion: apps/v1
kind: Deployment
metadata:
  name: ignore-only-deployment
  namespace: __NAMESPACE__
  annotations:
    aura.sh/power-eligible: "true"
  labels:
    aura-power-quality/revision: v1
spec:
  replicas: 2
  selector:
    matchLabels: {app: ignore-only-deployment}
  template:
    metadata:
      labels: {app: ignore-only-deployment}
    spec:
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
