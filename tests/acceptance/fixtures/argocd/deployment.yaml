apiVersion: apps/v1
kind: Deployment
metadata:
  name: aura-power-argocd-fixture
  annotations:
    aura.sh/power-eligible: "true"
  labels:
    app.kubernetes.io/name: aura-power-argocd-fixture
    app.kubernetes.io/part-of: aura-power-quality
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: aura-power-argocd-fixture
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aura-power-argocd-fixture
    spec:
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests: {cpu: 10m, memory: 8Mi}
            limits: {cpu: 20m, memory: 16Mi}
