# Aura Power v2.0 Helm Values
# Architecture: Server (API+Panel) + Controller (Reconciler/Worker)

# -- Global settings
global:
  namespace: ""  # defaults to release namespace

nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []

# -- Server component (API + Frontend + Auth)
server:
  enabled: true
  image:
    repository: ghcr.io/weauratech/aura-power-server
    tag: ""  # defaults to Chart.appVersion
    pullPolicy: IfNotPresent
  replicas: 1
  port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  # Auth (mandatory in v2.0)
  auth:
    # Reuse a pre-created Secret in GitOps environments. It must contain the
    # keys jwt-secret and admin-password.
    existingSecret: ""
    jwtSecret: ""  # generated once and retained when empty
    initialAdmin:
      username: "admin"
      password: ""  # generated once and retained when empty
    accessTokenTTL: "1h"
    refreshTokenTTL: "168h"
  # Persistence for SQLite
  persistence:
    enabled: true
    storageClass: ""  # cluster default
    size: "1Gi"
    accessModes:
      - ReadWriteOnce
  # Ingress
  ingress:
    enabled: false
    className: ""
    host: ""
    tls: false
    tlsSecretName: ""
    annotations: {}
  # Gateway API
  gateway:
    enabled: false
    gatewayRef:
      name: ""
      namespace: ""
    hostnames: []
  # Metrics providers
  prometheus:
    url: ""  # e.g., http://prometheus.monitoring.svc:9090
  opencost:
    url: ""  # e.g., http://opencost.opencost.svc:9003
  # Extra
  extraEnv: []
  podLabels: {}
  podAnnotations: {}
  nodeSelector: {}
  affinity: {}
  tolerations: []
  serviceAccount:
    create: true
    name: ""
    annotations: {}

# -- Controller component (Reconciler/Worker)
controller:
  enabled: true
  image:
    repository: ghcr.io/weauratech/aura-power-controller
    tag: ""  # defaults to Chart.appVersion
    pullPolicy: IfNotPresent
  replicas: 1  # singleton with leader election
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  leaderElection:
    enabled: true
    id: "aura-power-controller-leader.power.aura.sh"
  config:
    reconciliationInterval: "30s"
    discoveryInterval: "60s"
    auditRetentionDays: 7
    auditCleanupInterval: "6h"
    # Keep the Go heap below the pod limit so the runtime can collect before
    # Kubernetes terminates the process. Adjust together with resources.limits.memory.
    goMemLimit: "192MiB"
    systemNamespaceBlocklist:
      - kube-system
      - kube-public
      - kube-node-lease
      - aura-system
  extraEnv: []
  podLabels: {}
  podAnnotations: {}
  nodeSelector: {}
  affinity: {}
  tolerations: []
  serviceAccount:
    create: true
    name: ""
    annotations: {}

# -- Kubernetes admission for invariants that cannot be expressed by the CRD
# schema (for example IANA timezones and future override expiration).
webhook:
  enabled: false
  port: 9443
  failurePolicy: Fail
  timeoutSeconds: 5
  certificate:
    # The chart creates and retains a release-scoped self-signed certificate
    # across upgrades. Set certManager.enabled for managed rotation.
    durationDays: 3650
  certManager:
    enabled: false
    duration: 2160h
    renewBefore: 360h
    issuerRef:
      name: ""
      kind: ClusterIssuer
      group: cert-manager.io

# -- RBAC
rbac:
  create: true

# -- Service Monitor (Prometheus Operator)
serviceMonitor:
  enabled: false
  interval: 30s
  namespace: ""

# -- NetworkPolicies
networkPolicy:
  enabled: false
  # server allows ingress from anywhere on port 8080
  # controller allows ingress only from monitoring namespace on port 8080
  # Add ports used by HTTP notification webhooks that do not use 443.
  additionalServerEgressPorts: []
