apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: powernotificationchannels.power.aura.sh
spec:
  group: power.aura.sh
  names:
    kind: PowerNotificationChannel
    listKind: PowerNotificationChannelList
    plural: powernotificationchannels
    singular: powernotificationchannel
    shortNames:
      - pnc
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Type
          type: string
          jsonPath: .spec.type
        - name: Enabled
          type: boolean
          jsonPath: .spec.enabled
        - name: Sent
          type: integer
          jsonPath: .status.totalSent
        - name: Errors
          type: integer
          jsonPath: .status.totalErrors
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [type, enabled]
              properties:
                type:
                  type: string
                  enum: ["google-chat", "slack", "discord", "generic"]
                url:
                  type: string
                urlFrom:
                  type: object
                  properties:
                    name:
                      type: string
                    key:
                      type: string
                events:
                  type: array
                  items:
                    type: string
                namespaceFilter:
                  type: array
                  items:
                    type: string
                throttle:
                  type: string
                enabled:
                  type: boolean
                  default: true
                deliveryPolicy:
                  type: string
                  default: at-most-once
                  enum: ["at-most-once", "at-least-once"]
                maxDeliveryAttempts:
                  type: integer
                  format: int32
                  default: 5
                  minimum: 1
                  maximum: 20
            status:
              type: object
              properties:
                lastNotification:
                  type: string
                  format: date-time
                lastError:
                  type: string
                totalSent:
                  type: integer
                totalErrors:
                  type: integer
                lastAttempt:
                  type: object
                  required: [id, eventIDs, phase, startedAt, attemptCount]
                  properties:
                    id:
                      type: string
                    eventIDs:
                      type: array
                      items:
                        type: string
                    auditEventRefs:
                      type: array
                      items:
                        type: string
                    phase:
                      type: string
                      enum: [InProgress, Succeeded, Failed, Ambiguous]
                    startedAt:
                      type: string
                      format: date-time
                    completedAt:
                      type: string
                      format: date-time
                    providerStatusCode:
                      type: integer
                      format: int32
                    attemptCount:
                      type: integer
                      format: int32
                    response:
                      type: string
                recentAttempts:
                  type: array
                  maxItems: 20
                  items:
                    type: object
                    required: [id, eventIDs, phase, startedAt, attemptCount]
                    properties:
                      id:
                        type: string
                      eventIDs:
                        type: array
                        items:
                          type: string
                      auditEventRefs:
                        type: array
                        items:
                          type: string
                      phase:
                        type: string
                        enum: [InProgress, Succeeded, Failed, Ambiguous]
                      startedAt:
                        type: string
                        format: date-time
                      completedAt:
                        type: string
                        format: date-time
                      providerStatusCode:
                        type: integer
                        format: int32
                      attemptCount:
                        type: integer
                        format: int32
                      response:
                        type: string
