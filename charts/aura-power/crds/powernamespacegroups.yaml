apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: powernamespacegroups.power.aura.sh
spec:
  group: power.aura.sh
  names:
    kind: PowerNamespaceGroup
    listKind: PowerNamespaceGroupList
    plural: powernamespacegroups
    singular: powernamespacegroup
    shortNames:
      - png
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Namespaces
          type: string
          jsonPath: .spec.namespaces
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [namespaces]
              properties:
                namespaces:
                  type: array
                  items:
                    type: string
                  minItems: 1
