apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: powerschedules.power.aura.sh
spec:
  conversion:
    strategy: None
  group: power.aura.sh
  names:
    kind: PowerSchedule
    listKind: PowerScheduleList
    plural: powerschedules
    shortNames:
    - ps
    singular: powerschedule
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          spec:
            properties:
              description:
                type: string
              desiredState:
                enum:
                - true
                - false
                type: string
              windows:
                items:
                  properties:
                    days:
                      items:
                        type: integer
                      type: array
                    end:
                      type: string
                    start:
                      type: string
                    timezone:
                      type: string
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
