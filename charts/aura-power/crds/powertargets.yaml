apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: powertargets.power.aura.sh
spec:
  conversion:
    strategy: None
  group: power.aura.sh
  names:
    kind: PowerTarget
    listKind: PowerTargetList
    plural: powertargets
    shortNames:
    - pt
    singular: powertarget
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          spec:
            properties:
              targetRef:
                properties:
                  apiVersion:
                    type: string
                  cluster:
                    type: string
                  kind:
                    enum:
                    - Deployment
                    - StatefulSet
                    - CronJob
                    type: string
                  name:
                    type: string
                  namespace:
                    type: string
                  uid:
                    type: string
                type: object
            type: object
          status:
            properties:
              action:
                description: Durable state of the current power transition.
                properties:
                  attemptedAt:
                    format: date-time
                    type: string
                  auditAction:
                    type: string
                  auditEventID:
                    type: string
                  auditPhase:
                    enum:
                    - Pending
                    - Recorded
                    type: string
                  auditRuleName:
                    type: string
                  notificationSuppressed:
                    type: boolean
                  notificationSuppressionSource:
                    enum:
                    - namespace-label
                    - resolution-error
                    type: string
                  notificationSuppressionNamespaceUID:
                    type: string
                  completedAt:
                    format: date-time
                    type: string
                  decisionKey:
                    type: string
                  desiredState:
                    enum:
                    - "on"
                    - "off"
                    type: string
                  message:
                    type: string
                  phase:
                    enum:
                    - InProgress
                    - Applied
                    - Converged
                    - Contended
                    - Failed
                    type: string
                  retryToken:
                    type: string
                required:
                - decisionKey
                - desiredState
                - phase
                type: object
            type: object
            x-kubernetes-preserve-unknown-fields: true
        type: object
    served: true
    storage: true
    subresources:
      status: {}
