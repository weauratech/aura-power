{{- if .Values.server.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aura-power.server.fullname" . }}-secret
  labels:
    {{- include "aura-power.server.labels" . | nindent 4 }}
type: Opaque
data:
  jwt-secret: {{ .Values.server.auth.jwtSecret | default (randAlphaNum 32) | b64enc | quote }}
  {{- if .Values.server.auth.initialAdmin.password }}
  admin-password: {{ .Values.server.auth.initialAdmin.password | b64enc | quote }}
  {{- end }}
{{- end }}
