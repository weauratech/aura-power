{{- if and .Values.server.enabled (not .Values.server.auth.existingSecret) }}
{{- $secretName := printf "%s-secret" (include "aura-power.server.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $jwtSecret := "" }}
{{- $adminPassword := "" }}
{{- if .Values.server.auth.jwtSecret }}
{{- $jwtSecret = (.Values.server.auth.jwtSecret | b64enc) }}
{{- else if and $existing $existing.data (hasKey $existing.data "jwt-secret") }}
{{- $jwtSecret = (index $existing.data "jwt-secret") }}
{{- else }}
{{- $jwtSecret = (randAlphaNum 48 | b64enc) }}
{{- end }}
{{- if .Values.server.auth.initialAdmin.password }}
{{- $adminPassword = (.Values.server.auth.initialAdmin.password | b64enc) }}
{{- else if and $existing $existing.data (hasKey $existing.data "admin-password") }}
{{- $adminPassword = (index $existing.data "admin-password") }}
{{- else }}
{{- $adminPassword = (randAlphaNum 32 | b64enc) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  {{- if .Values.server.auth.keepManagedSecret }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
  labels:
    {{- include "aura-power.server.labels" . | nindent 4 }}
type: Opaque
data:
  jwt-secret: {{ $jwtSecret | quote }}
  admin-password: {{ $adminPassword | quote }}
{{- end }}
