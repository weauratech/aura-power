{{- if .Values.server.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "aura-power.server.fullname" . }}
  labels:
    {{- include "aura-power.server.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.server.replicas }}
  serviceName: {{ include "aura-power.server.fullname" . }}-headless
  selector:
    matchLabels:
      {{- include "aura-power.server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aura-power.server.selectorLabels" . | nindent 8 }}
        {{- with .Values.server.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.server.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "aura-power.server.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: "{{ .Values.server.image.repository }}:{{ .Values.server.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: {{ .Values.server.port }}
              protocol: TCP
          env:
            - name: API_PORT
              value: {{ .Values.server.port | quote }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "aura-power.server.fullname" . }}-secret
                  key: jwt-secret
            - name: AUTH_DB_PATH
              value: "/data/aura-power.db"
            - name: ADMIN_USERNAME
              value: {{ .Values.server.auth.initialAdmin.username | quote }}
            {{- if .Values.server.auth.initialAdmin.password }}
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "aura-power.server.fullname" . }}-secret
                  key: admin-password
            {{- end }}
            {{- if .Values.server.prometheus.url }}
            - name: PROMETHEUS_URL
              value: {{ .Values.server.prometheus.url | quote }}
            {{- end }}
            {{- if .Values.server.opencost.url }}
            - name: OPENCOST_URL
              value: {{ .Values.server.opencost.url | quote }}
            {{- end }}
            {{- with .Values.server.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.server.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.server.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          {{- toYaml .Values.server.persistence.accessModes | nindent 10 }}
        {{- if .Values.server.persistence.storageClass }}
        storageClassName: {{ .Values.server.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.server.persistence.size }}
  {{- end }}
{{- end }}
