{{- if .Values.controller.enabled }}
{{- if .Values.controller.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aura-power.controller.serviceAccountName" . }}
  labels:
    {{- include "aura-power.controller.labels" . | nindent 4 }}
  {{- with .Values.controller.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if .Values.rbac.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "aura-power.controller.fullname" . }}
  labels:
    {{- include "aura-power.controller.labels" . | nindent 4 }}
rules:
  # Full CRD management
  - apiGroups: ["power.aura.sh"]
    resources: ["powerpolicies", "poweroverrides", "powertargets", "powerauditevents", "powerschedules", "powernamespacegroups"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["power.aura.sh"]
    resources: ["powerpolicies/status", "poweroverrides/status", "powertargets/status"]
    verbs: ["get", "update", "patch"]
  # Workload execution (power-down / restore)
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "deployments/scale", "statefulsets/scale"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list", "watch", "patch", "update"]
  # Discovery
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  # Events
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # Leader election
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "aura-power.controller.fullname" . }}
  labels:
    {{- include "aura-power.controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "aura-power.controller.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "aura-power.controller.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
