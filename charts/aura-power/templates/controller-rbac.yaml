{{- if .Values.controller.enabled }}
{{- if .Values.controller.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aura-power.controller.serviceAccountName" . }}
  labels:
    {{- include "aura-power.controller.labels" . | nindent 4 }}
  {{- with .Values.controller.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if .Values.rbac.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "aura-power.controller.fullname" . }}
  labels:
    {{- include "aura-power.controller.labels" . | nindent 4 }}
rules:
  # Workload execution (power-down / restore)
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "deployments/scale", "statefulsets/scale"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list", "watch", "patch", "update"]
  # Capability readiness checks the installed CRD schema before mutation.
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get"]
  # Discovery
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  # Events
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "aura-power.controller.fullname" . }}
  labels:
    {{- include "aura-power.controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "aura-power.controller.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "aura-power.controller.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# Aura decision state and leader election are restricted to the release
# namespace even though workload discovery and execution are cluster-wide.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "aura-power.controller.fullname" . }}-control
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aura-power.controller.labels" . | nindent 4 }}
rules:
  - apiGroups: ["power.aura.sh"]
    resources: ["poweroverrides", "powernamespacegroups"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["power.aura.sh"]
    resources: ["powerpolicies"]
    verbs: ["get", "list", "watch", "create", "update"]
  - apiGroups: ["power.aura.sh"]
    resources: ["powerschedules"]
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: ["power.aura.sh"]
    resources: ["powertargets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["power.aura.sh"]
    resources: ["powerauditevents"]
    verbs: ["get", "list", "watch", "create", "delete"]
  # Required by OwnerReferencesPermissionEnforcement when durable deliveries
  # set blockOwnerDeletion on their owning audit event.
  - apiGroups: ["power.aura.sh"]
    resources: ["powerauditevents/finalizers"]
    verbs: ["update"]
  - apiGroups: ["power.aura.sh"]
    resources: ["powernotificationchannels"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["power.aura.sh"]
    resources: ["powernotificationdeliveries"]
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: ["power.aura.sh"]
    resources: ["powerpolicies/status", "poweroverrides/status", "powertargets/status", "powernotificationchannels/status", "powernotificationdeliveries/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "aura-power.controller.fullname" . }}-control
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aura-power.controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "aura-power.controller.fullname" . }}-control
subjects:
  - kind: ServiceAccount
    name: {{ include "aura-power.controller.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# Webhook credentials stay namespace-scoped. A channel can only reference a
# Secret in its own namespace, and the standard installation stores channels
# in the release namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "aura-power.controller.fullname" . }}-notification-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aura-power.controller.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "aura-power.controller.fullname" . }}-notification-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aura-power.controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "aura-power.controller.fullname" . }}-notification-secrets
subjects:
  - kind: ServiceAccount
    name: {{ include "aura-power.controller.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
