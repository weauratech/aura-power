{{- if .Values.server.enabled }}
{{- if .Values.server.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aura-power.server.serviceAccountName" . }}
  labels:
    {{- include "aura-power.server.labels" . | nindent 4 }}
  {{- with .Values.server.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if .Values.rbac.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "aura-power.server.fullname" . }}
  labels:
    {{- include "aura-power.server.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "aura-power.server.fullname" . }}
  labels:
    {{- include "aura-power.server.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "aura-power.server.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "aura-power.server.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "aura-power.server.fullname" . }}-control
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aura-power.server.labels" . | nindent 4 }}
rules:
  - apiGroups: ["power.aura.sh"]
    resources: ["powerpolicies", "poweroverrides", "powerschedules", "powernamespacegroups", "powernotificationchannels"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["power.aura.sh"]
    resources: ["powertargets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["power.aura.sh"]
    resources: ["powerauditevents"]
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: ["power.aura.sh"]
    resources: ["powerpolicies/status", "poweroverrides/status", "powertargets/status", "powernotificationchannels/status"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "aura-power.server.fullname" . }}-control
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aura-power.server.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "aura-power.server.fullname" . }}-control
subjects:
  - kind: ServiceAccount
    name: {{ include "aura-power.server.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
