version: 2

before:
  hooks:
    - go mod tidy
    - mkdir -p cmd/server/panelassets
    - sh -c 'echo "<html></html>" > cmd/server/panelassets/index.html'

builds:
  - id: aura-power
    main: ./cmd/aura-power/
    binary: aura-power
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}}

archives:
  - id: default
    formats: ['tar.gz']
    format_overrides:
      - goos: windows
        formats: ['zip']
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^ci:"
      - "^test:"

release:
  github:
    owner: weauratech
    name: aura-power
  prerelease: auto
  name_template: "{{.Tag}}"
