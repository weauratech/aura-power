version: 2

before:
  hooks:
    - go mod verify

builds:
  - id: aura-power
    main: ./cmd/aura-power/
    binary: aura-power
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}}

archives:
  - id: default
    formats: ['tar.gz']
    format_overrides:
      - goos: windows
        formats: ['zip']
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

# Syft is installed at a pinned revision by the release workflow. GoReleaser
# publishes one SPDX SBOM beside every platform archive.
sboms:
  - artifacts: archive

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^ci:"
      - "^test:"

release:
  github:
    owner: weauratech
    name: aura-power
  prerelease: auto
  draft: true
  use_existing_draft: true
  make_latest: false
  preflight:
    fail_on_error: true
  name_template: "{{.Tag}}"
