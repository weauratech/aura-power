apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: powerpolicies.power.aura.sh
spec:
  group: power.aura.sh
  names:
    kind: PowerPolicy
    listKind: PowerPolicyList
    plural: powerpolicies
    singular: powerpolicy
    shortNames: [pp]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                scope:
                  type: object
                  properties:
                    namespaces: { type: array, items: { type: string } }
                    namespaceLabels: { type: object, additionalProperties: { type: string } }
                    workloadNames: { type: array, items: { type: string } }
                    workloadLabels: { type: object, additionalProperties: { type: string } }
                schedule:
                  type: object
                  properties:
                    windows:
                      type: array
                      items:
                        type: object
                        properties:
                          start: { type: string }
                          end: { type: string }
                          days: { type: array, items: { type: integer } }
                          timezone: { type: string }
                    desiredState: { type: string }
                priority: { type: integer, default: 0 }
                description: { type: string }
            status:
              type: object
              properties:
                conditions: { type: array, items: { type: object, x-kubernetes-preserve-unknown-fields: true } }
                affectedTargets: { type: integer }
                activeWindow: { type: boolean }
                nextTransition: { type: string, format: date-time }
