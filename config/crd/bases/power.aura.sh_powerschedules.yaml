apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: powerschedules.power.aura.sh
spec:
  group: power.aura.sh
  names:
    kind: PowerSchedule
    listKind: PowerScheduleList
    plural: powerschedules
    singular: powerschedule
    shortNames: [ps]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                windows:
                  type: array
                  items:
                    type: object
                    properties:
                      start: { type: string }
                      end: { type: string }
                      days: { type: array, items: { type: integer } }
                      timezone: { type: string }
                desiredState: { type: string, enum: [on, off] }
                description: { type: string }
