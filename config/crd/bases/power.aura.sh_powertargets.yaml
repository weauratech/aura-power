apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: powertargets.power.aura.sh
spec:
  group: power.aura.sh
  names:
    kind: PowerTarget
    listKind: PowerTargetList
    plural: powertargets
    singular: powertarget
    shortNames: [pt]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                targetRef:
                  type: object
                  properties:
                    cluster: { type: string }
                    apiVersion: { type: string }
                    namespace: { type: string }
                    name: { type: string }
                    kind: { type: string, enum: [Deployment, StatefulSet, CronJob] }
                    uid: { type: string }
            status:
              properties:
                action:
                  description: Durable state of the current power transition.
                  properties:
                    attemptedAt:
                      format: date-time
                      type: string
                    auditAction:
                      type: string
                    auditEventID:
                      type: string
                    auditPhase:
                      enum:
                      - Pending
                      - Recorded
                      type: string
                    auditRuleName:
                      type: string
                    completedAt:
                      format: date-time
                      type: string
                    decisionKey:
                      type: string
                    desiredState:
                      enum:
                      - "on"
                      - "off"
                      type: string
                    message:
                      type: string
                    phase:
                      enum:
                      - InProgress
                      - Applied
                      - Converged
                      - Contended
                      - Failed
                      type: string
                    retryToken:
                      type: string
                  required:
                  - decisionKey
                  - desiredState
                  - phase
                  type: object
              type: object
              x-kubernetes-preserve-unknown-fields: true
