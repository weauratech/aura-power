apiVersion: power.aura.sh/v1alpha1
kind: PowerPolicy
metadata:
  name: dev-off-hours
  namespace: aura-system
spec:
  scope:
    namespaces:
      - dev
  schedule:
    windows:
      - start: "08:00"
        end: "18:00"
        days: [1, 2, 3, 4, 5]
        timezone: "America/Sao_Paulo"
    desiredState: "on"
  priority: 10
  description: "Power down dev namespace workloads outside business hours (Mon-Fri 08:00-18:00 BRT)"
