run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - unconvert
    - bodyclose
    - noctx
    - prealloc

linters-settings:
  goimports:
    local-prefixes: github.com/weauratech/aura-power
  misspell:
    locale: US

issues:
  exclude-dirs:
    - vendor
    - web
    - aidlc-docs
  max-issues-per-linter: 50
  max-same-issues: 5
